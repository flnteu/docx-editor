name: FluentaOne supply-chain gate

# Vendor gate for the `flnteu/docx-editor` fork — runs the security +
# license + reproducible-build audit defined in
# `flnt-docs-central/architecture/spikes/SPIKE-DOCEDIT-001-eigenpal-evaluation.md`
# §"Production gates".
#
# This workflow does NOT replace the upstream CI (lint / test / build
# from `.github/workflows/ci.yml`). It runs ADDITIONALLY on every push
# to the fork's main branch + on every tag matching `v*` that we
# intend to publish to the FluentaOne private registry.
#
# Pulling in a new upstream version — `gh repo sync` DOES NOT WORK here, and
# the full procedure lives in FLNTEU-README.md ("Syncing to a new upstream
# version"). In one line: upstream re-initialized its git history on
# 2026-07-20, so the fork and upstream share no commit at all
# (`git merge-base origin/main upstream/main` exits 1). A sync is therefore a
# two-parent merge that takes upstream's tree wholesale and re-applies the
# flnteu overlay, delivered as a branch + PR, with the candidate tag
# `v<upstream-version>-flnteu` pushed on the branch tip to trigger this gate.
# The gate must be green before that tag becomes the FluentaOne
# private-registry source.
#
# Failure semantics — each check fails closed:
#   - npm audit at the `high` band → block.
#   - License outside the permissive allowlist → block.
#   - Build / typecheck failure → block.
#
# Toolchain (DEV-1218): all three jobs install via `bun install
# --frozen-lockfile`, not npm. This is a bun-native monorepo — 10
# `examples/*` workspaces use the `workspace:*` protocol, which npm has
# never supported. That's not a scoping problem you can flag your way out
# of: `npm install --workspaces=false` still throws EUNSUPPORTEDPROTOCOL,
# because npm's arborist walks every directory named in the root
# `workspaces` glob to build the ideal tree regardless of that flag, and
# then trips over the `workspace:*` ranges declared inside THEIR
# package.json files. Trying to make npm parse a bun workspace is a dead
# end; bun is the toolchain this repo actually uses, so the gate now uses
# it too.
#
# The `BUN_VERSION` pin below MUST track `bun.lock` — a stale pin is
# exactly what broke the reproducible-build job before this fix (it was
# pinned to "1.1.0", which no longer satisfies `--frozen-lockfile` against
# the lockfile's current contents). Bump it deliberately whenever
# `bun install --frozen-lockfile` starts failing locally, and re-verify
# `bun run -F "*" typecheck` / `bun run -F "*" build` before bumping.

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Re-verified 2026-08-19 (DEV-2291) against upstream 2.5.0's lockfile:
  # `bun install --frozen-lockfile` is clean, `bun run --filter './packages/*'
  # typecheck` and `bun run build:packages` both pass, and `bun run test` is
  # 7214 pass / 0 fail. Upstream's own CI pins `bun-version: latest`; this
  # gate stays on an exact pin on purpose, so a bun release cannot change what
  # the vendor gate measured. See the toolchain note above before bumping.
  BUN_VERSION: "1.3.14"

jobs:
  audit:
    name: npm audit (band high)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install (frozen lockfile, no scripts)
        # --ignore-scripts preserves the original job's intent (see git
        # history: "Install (lockfile-only, no scripts)") — don't execute
        # any dependency's lifecycle scripts before its own code has even
        # been through the audit below.
        run: bun install --frozen-lockfile --ignore-scripts
      - name: bun audit (published-package closure)
        # `bun audit` (bun >=1.2) reads bun.lock directly — no
        # node_modules required — but it has no scope flag: it audits every
        # resolved package, including the 10 upstream examples/* demo apps
        # (next, nuxt, remix, astro, ...) that this fork never builds,
        # publishes, or serves (the reproducible-build job below builds
        # packages/* only). Historically those demos produced nearly all of
        # the findings, so the gate blocked on risk that never ships.
        #
        # .github/flnteu/audit-scope.mjs therefore filters the audit to the
        # transitive dependency closure of the packages/* workspaces plus
        # the root build tooling (devDependencies included on purpose — the
        # toolchain that produces the published artifacts is supply-chain
        # surface). In-scope high/critical advisories fail closed exactly
        # like plain `bun audit --audit-level=high`; examples/*-only
        # findings are printed as informational. See the script header for
        # the mechanics and the conservative name-level graph walk.
        #
        # Remediation status (DEV-2291, 2026-08-19, upstream 2.5.0):
        # THE IGNORE LIST IS NOW EMPTY. Do not add to it without recording
        # the removal condition, as the entries below once did.
        #
        # Upstream 2.5.0 raised 38 in-scope high/critical findings. They were
        # cleared two ways, and the split matters:
        #
        #  - 21 by seven root-level overrides (see package.json "overrides":
        #    brace-expansion, fast-uri, js-yaml, nanoid, postcss, vite, ws).
        #    Every one had a patched release published well before the bunfig
        #    minimumReleaseAge window, so unlike DEV-1218 nothing had to be
        #    parked. The overrides collapse some transitive copies across a
        #    major line (brace-expansion 1.x/2.x -> 5.0.9, js-yaml 3.x ->
        #    4.3.1, ws 7.x -> 8.x, vite 5.x/7.x -> 8.1.5), which is why they
        #    are only defensible alongside a green `bun run test`.
        #
        #  - 17 by correcting the SCOPE, not the tree: they were reachable
        #    only through `packages/nuxt`, a `private: true` WIP workspace
        #    that is never published and is excluded from `build:packages`.
        #    That set contained all three criticals. See the long comment in
        #    audit-scope.mjs; the exclusion is asserted by
        #    .github/flnteu/audit-scope.test.mjs, run as a step below.
        #
        # NOT a full `bun update`: re-resolving the whole lockfile was
        # measured first and moved the count 39 -> 38 while diverging 994
        # lines from upstream's lock, so the fork keeps upstream's lockfile
        # plus the seven documented overrides.
        run: |
          bun audit --json > /tmp/bun-audit.json || true
          bun .github/flnteu/audit-scope.mjs /tmp/bun-audit.json bun.lock

      - name: audit-scope self-test (positive control)
        # The scoping filter is the only thing standing between "this gate is
        # strict" and "this gate cannot fail". Its own tests assert that an
        # in-scope high still exits 1, that the private-workspace exclusion
        # excludes exactly the private workspaces, and that an unreadable
        # manifest fails closed. Run them in CI, next to the filter they
        # guard, so a well-meaning scope tweak cannot quietly hollow the gate.
        run: bun .github/flnteu/audit-scope.test.mjs

  licenses:
    name: License allowlist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install (frozen lockfile)
        # license-checker-rseidelsohn needs a real node_modules tree (it
        # reads each installed package's LICENSE file / package.json
        # `license` field) — a lockfile-only pass isn't enough here, unlike
        # the audit job above.
        run: bun install --frozen-lockfile
      - name: license-checker
        run: |
          # --excludePrivatePackages (new, DEV-1218): without it the scan
          # fails immediately on the root `docx-editor-monorepo` package
          # itself — private:true resolves to license "UNLICENSED", which
          # isn't in --onlyAllow — before it ever gets to a real
          # third-party package. This scopes out the root plus every
          # private examples/* demo app; it does not change which
          # licenses are permitted.
          #
          # No --production (dropped vs. the original flag, DEV-1218):
          # this root package.json declares no top-level "dependencies",
          # only "devDependencies", so --production silently reduces the
          # check to zero packages — an exit-0 pass that verified nothing.
          # That is the "vacuous gate" failure mode called out for the
          # audit job's npm fallback, just showing up here instead.
          # Dropping it keeps the check real: ~33 packages today (root-level
          # tooling deps), all MIT/Apache-2.0/dual-licensed, still gated by
          # the exact same allowlist below.
          #
          # --onlyAllow is byte-for-byte unchanged from the original policy —
          # not widened.
          #
          # --excludePackages, renamed for 2.x (DEV-2291): the two names it
          # carried, @eigenpal/docx-editor-{core,react}, no longer exist
          # anywhere — upstream renamed the packages to @docx-editor.dev/* at
          # 2.0, so the flag had quietly become a no-op that excluded nothing.
          # The list is now every FIRST-PARTY package this repo publishes.
          # These are not third-party dependencies and their licensing is a
          # product decision, not a supply-chain allowlist question: two of
          # them (pro, editor-api) ship under the source-available
          # LicenseRef-EigenPal-Pro-Evaluation-1.0, and packages/fonts is
          # "Apache-2.0 AND OFL-1.1" for the font binaries it carries. None of
          # those are on the allowlist, and none should be — an allowlist of
          # permissive licenses is the wrong instrument for the licence we
          # ourselves vendored under. Measured today the scan resolves 37
          # root-level tooling packages and reaches none of these, so this
          # flag is defence for when that scope widens, not a live exclusion.
          #
          # The scan really can fail: with Apache-2.0 removed from
          # --onlyAllow it exits 1 on @playwright/test (verified 2026-08-19).
          npx --yes license-checker-rseidelsohn \
            --excludePrivatePackages \
            --onlyAllow "MIT;Apache-2.0;BSD-3-Clause;BSD-2-Clause;ISC;0BSD;CC0-1.0;CC-BY-4.0;Unlicense" \
            --excludePackages "@docx-editor.dev/core;@docx-editor.dev/react;@docx-editor.dev/i18n;@docx-editor.dev/fonts;@docx-editor.dev/editor-api;@docx-editor.dev/pro" \
            --summary

  reproducible-build:
    name: Reproducible build + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: bun install (frozen lockfile)
        run: bun install --frozen-lockfile
      # Scoped to packages/* — the published set that becomes the FluentaOne
      # private-registry source (see the header). The previous `-F "*"` also
      # built the 10 examples/* demo apps, so the gate blocked on upstream demo
      # breakage that never ships: examples/nextjs currently fails `next build`
      # with "Cannot find module or type declarations for side-effect import of
      # './globals.css'". That is an upstream demo bug, not a supply-chain risk
      # in anything we publish, and patching upstream's demos inside this fork
      # would conflict on every `gh repo sync`. `build:packages` is the repo's
      # own canonical published-package build, already ordered by inter-package
      # dependency.
      - name: typecheck (published packages)
        run: bun run --filter './packages/*' typecheck
      - name: build (published packages)
        run: bun run build:packages

  fork-integrity:
    name: Fork integrity check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assert this is the FluentaOne fork
        run: |
          # Defence-in-depth: refuse to run the gate on an upstream
          # PR that gets mirrored into the fork. The fork's repo
          # name + owner must match before we publish anything to
          # the FluentaOne private registry.
          if [ "$GITHUB_REPOSITORY" != "flnteu/docx-editor" ]; then
            echo "::error::Refusing to run the FluentaOne supply-chain gate on $GITHUB_REPOSITORY"
            exit 1
          fi
